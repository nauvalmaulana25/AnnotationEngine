[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "annotation-engine"
version = "1.0.0"
description = "Hybrid Image Annotation Desktop Application with Zero-Shot AI"
readme = "README.md"
license = {text = "GPL-3.0-only"}
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "onnxruntime>=1.19.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "transformers>=4.36.0",
    "huggingface_hub>=0.20.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.1.0",
    "numpy>=1.26.0",
    "httpx>=0.25.0",
    "pyyaml>=6.0.1",
    "cryptography>=41.0.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
annotation-engine = "annotation_engine.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["annotation_engine*"]

[tool.setuptools.package-data]
"*" = ["resources/**/*", "labelme/**/*"]

[tool.pytest.ini_options]
qt_api = "pyside6"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "W", "UP", "B", "C4", "PTH"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true